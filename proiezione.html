<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FantaCompleanno — Proiezione</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Space+Grotesk:wght@400;500;700;800&family=Space+Mono:wght@400;700&display=swap');

:root {
  --bg: #07070b; --surface: #15151e; --border: #262638;
  --accent-cody: #ff6b2b; --accent-siria: #a855f7;
  --text: #f5f5fa; --text-muted: #9090b0;
  --green: #22c55e; --red: #ef4444; --gold: #f59e0b;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  font-family: 'Space Grotesk', sans-serif;
  background: var(--bg); color: var(--text);
}
body {
  background:
    radial-gradient(circle at 12% 15%, rgba(255,107,43,0.10), transparent 45%),
    radial-gradient(circle at 88% 85%, rgba(168,85,247,0.10), transparent 45%),
    var(--bg);
}

/* ── TOP BAR (controlli, nascosta in proiezione pura ma utile a chi pilota) ── */
.ctrl-bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 200;
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 24px; background: rgba(7,7,11,0.85); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
  font-family: 'Space Mono', monospace; font-size: 12px;
  transition: opacity .3s;
}
.ctrl-bar.hidden { opacity: 0; pointer-events: none; }
.ctrl-tabs { display: flex; gap: 6px; }
.ctrl-tab {
  padding: 7px 16px; border-radius: 100px; cursor: pointer;
  border: 1px solid var(--border); color: var(--text-muted);
  background: var(--surface); transition: all .2s; font-weight: 700;
}
.ctrl-tab.active { color: var(--bg); background: var(--accent-cody); border-color: var(--accent-cody); }
.ctrl-toggle-hide {
  background: none; border: 1px solid var(--border); color: var(--text-muted);
  padding: 6px 14px; border-radius: 100px; cursor: pointer; font-family: inherit; font-size: 11px;
}
.show-ctrl-btn {
  position: fixed; top: 10px; right: 10px; z-index: 201;
  width: 36px; height: 36px; border-radius: 50%; background: var(--surface);
  border: 1px solid var(--border); color: var(--text-muted); cursor: pointer;
  display: none; align-items: center; justify-content: center; font-size: 16px;
}
.show-ctrl-btn.visible { display: flex; }

/* ── STAGE ── */
.stage {
  width: 100%; height: 100vh; padding-top: 56px;
  display: flex; align-items: center; justify-content: center;
  position: relative;
}
.view { display: none; width: 100%; height: 100%; padding: 24px 40px; }
.view.active { display: flex; flex-direction: column; }

/* ── HEADER COMUNE ── */
.view-header { text-align: center; margin-bottom: 18px; flex-shrink: 0; }
.view-title {
  font-family: 'Cinzel', serif; font-weight: 800; font-size: clamp(28px, 4vw, 46px);
  letter-spacing: .02em;
  background: linear-gradient(90deg, var(--accent-cody), var(--gold), var(--accent-siria));
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.view-sub { font-size: 14px; color: var(--text-muted); margin-top: 4px; font-family: 'Space Mono', monospace; }

/* ══════════ CLASSIFICA ROTANTE ══════════ */
.lb-body {
  flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
  max-width: 1000px; margin: 0 auto; width: 100%;
  scrollbar-width: none; -ms-overflow-style: none;
}
.lb-body::-webkit-scrollbar { display: none; }
.lb-row {
  display: flex; align-items: center; gap: 20px;
  background: var(--surface); border: 1.5px solid var(--border); border-radius: 16px;
  padding: 14px 28px; opacity: 0; transform: translateX(-30px);
  animation: lbIn .5s ease forwards;
}
.lb-row.top1 { border-color: var(--gold); background: linear-gradient(90deg, rgba(245,158,11,0.12), var(--surface)); }
.lb-row.me { border-color: var(--accent-cody); }
@keyframes lbIn { to { opacity: 1; transform: translateX(0); } }
.lb-pos {
  font-family: 'Space Mono', monospace; font-weight: 800; font-size: 26px;
  width: 56px; text-align: center; color: var(--text-muted); flex-shrink: 0;
}
.lb-row.top1 .lb-pos { color: var(--gold); }
.lb-row:nth-child(2) .lb-pos { color: #c0c0d0; }
.lb-row:nth-child(3) .lb-pos { color: #cd7f32; }
.lb-info { flex: 1; min-width: 0; }
.lb-name { font-size: 22px; font-weight: 800; }
.lb-meta { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
.lb-pts { font-family: 'Space Mono', monospace; font-weight: 800; font-size: 26px; color: var(--green); flex-shrink: 0; }
.lb-pts.neg { color: var(--red); }
.lb-empty { text-align: center; color: var(--text-muted); font-size: 18px; padding: 60px; }

/* Fazioni bars (dentro lb view quando tab=fazioni) */
.faz-bars-wrap { display: flex; flex-direction: column; gap: 24px; max-width: 800px; margin: auto; width: 100%; }

/* Bonus/Malus più frequenti — una fase alla volta, colonna singola */
.freq-single { display: flex; flex-direction: column; gap: 8px; max-width: 800px; margin: 0 auto; width: 100%; }
.freq-section-title {
  font-family: 'Cinzel', serif; font-size: 26px; font-weight: 700;
  margin-bottom: 16px; text-align: center;
  animation: fadeInTitle .5s ease;
}
@keyframes fadeInTitle { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
.faz-bar-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: 18px; padding: 24px 28px; }
.faz-bar-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.faz-bar-name { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 800; }
.faz-bar-img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
.faz-bar-pts { font-family: 'Space Mono', monospace; font-size: 26px; font-weight: 800; }
.faz-track { height: 18px; background: rgba(255,255,255,0.05); border-radius: 100px; overflow: hidden; }
.faz-fill { height: 100%; border-radius: 100px; transition: width .8s ease; }
.faz-fill.cody { background: linear-gradient(90deg, #ff6b2b, #ff9456); }
.faz-fill.siria { background: linear-gradient(90deg, #a855f7, #c081fa); }

/* ══════════ SLOT MACHINE ESTRAZIONE ══════════ */
.slot-arena {
  flex: 1; display: flex; align-items: center; justify-content: center;
  gap: 16px; flex-wrap: wrap; padding: 0 20px;
}
.slot-group {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.slot-group-label {
  font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: .12em;
  text-transform: uppercase; font-weight: 700;
}
.slot-group-label.a { color: var(--accent-cody); }
.slot-group-label.b { color: var(--accent-siria); }

.slot-window {
  width: 240px; height: 90px; overflow: hidden; border-radius: 16px;
  border: 2px solid var(--border); background: var(--surface);
  position: relative; box-shadow: 0 0 0 0 transparent; transition: box-shadow .4s;
}
.slot-window.team-a { border-color: rgba(255,107,43,0.4); }
.slot-window.team-b { border-color: rgba(168,85,247,0.4); }
.slot-window.landed.team-a {
  border-color: var(--accent-cody);
  box-shadow: 0 0 40px rgba(255,107,43,0.5), inset 0 0 20px rgba(255,107,43,0.08);
}
.slot-window.landed.team-b {
  border-color: var(--accent-siria);
  box-shadow: 0 0 40px rgba(168,85,247,0.5), inset 0 0 20px rgba(168,85,247,0.08);
}
/* linee guida laterali */
.slot-window::before, .slot-window::after {
  content: ""; position: absolute; left: 0; right: 0; height: 2px; z-index: 3; pointer-events: none;
}
.slot-window::before { top: 18px; background: rgba(255,255,255,0.06); }
.slot-window::after { bottom: 18px; background: rgba(255,255,255,0.06); }

.slot-reel {
  display: flex; flex-direction: column; align-items: center;
  transition: transform 0s; /* sostituto con JS */
}
.slot-item {
  width: 240px; height: 90px; display: flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: 800; text-align: center; padding: 0 16px;
  line-height: 1.2; flex-shrink: 0;
}
.slot-item.winner {
  color: var(--text);
  animation: slotPop .45s cubic-bezier(.34,1.56,.64,1) forwards;
}
@keyframes slotPop {
  0% { transform: scale(.85); opacity: .6; }
  60% { transform: scale(1.08); }
  100% { transform: scale(1); opacity: 1; }
}

/* VS row */
.slot-vs-row {
  display: flex; align-items: center; justify-content: center; gap: 28px;
  margin: 10px 0; flex-shrink: 0;
}
.slot-team-label {
  font-family: 'Cinzel', serif; font-size: clamp(14px,2vw,22px); font-weight: 800;
  text-align: center; max-width: 300px; line-height: 1.3;
}
.slot-vs-badge {
  font-family: 'Cinzel', serif; font-size: clamp(28px,4vw,52px); font-weight: 800;
  color: var(--gold); text-shadow: 0 0 30px rgba(245,158,11,0.6);
  animation: vsPulse 1.8s ease-in-out infinite;
}
@keyframes vsPulse { 0%,100% { opacity:1; } 50% { opacity:.6; } }

/* Controlli */
.slot-controls {
  display: flex; align-items: center; justify-content: center; gap: 14px;
  padding: 16px 0; flex-shrink: 0;
}
.slot-btn {
  background: linear-gradient(135deg, var(--accent-cody), var(--gold));
  color: #1a0a00; border: none; border-radius: 100px;
  padding: 16px 48px; font-size: 20px; font-weight: 800; cursor: pointer;
  font-family: 'Space Grotesk', sans-serif; letter-spacing: .02em;
  box-shadow: 0 4px 24px rgba(255,107,43,0.4);
  transition: transform .15s, box-shadow .15s;
}
.slot-btn:hover { transform: scale(1.04); box-shadow: 0 6px 32px rgba(255,107,43,0.6); }
.slot-btn:disabled { opacity:.4; cursor:not-allowed; transform:none; }
.slot-btn-secondary {
  background: var(--surface); border: 1.5px solid var(--border); color: var(--text-muted);
  border-radius: 100px; padding: 12px 28px; font-size: 15px; font-weight: 700; cursor: pointer;
  font-family: 'Space Grotesk', sans-serif; transition: all .2s;
}
.slot-btn-secondary:hover { border-color: var(--text-muted); color: var(--text); }

/* ══════════ REVEAL FAZIONI ══════════ */
.reveal-wrap { flex: 1; display: flex; flex-direction: column; }
.reveal-stage-label {
  text-align: center; font-family: 'Cinzel', serif; font-size: 18px; color: var(--gold);
  margin-bottom: 18px; letter-spacing: .05em; text-transform: uppercase;
}
.reveal-columns { flex: 1; display: flex; gap: 28px; overflow: hidden; }
.reveal-col { flex: 1; display: flex; flex-direction: column; border-radius: 20px; padding: 18px; overflow: hidden; }
.reveal-col.cody { background: linear-gradient(180deg, rgba(255,107,43,0.10), transparent); border: 1.5px solid rgba(255,107,43,0.3); }
.reveal-col.siria { background: linear-gradient(180deg, rgba(168,85,247,0.10), transparent); border: 1.5px solid rgba(168,85,247,0.3); }
.reveal-col-head { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 14px; flex-shrink: 0; }
.reveal-col-head img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
.reveal-col-title { font-family: 'Cinzel', serif; font-size: 20px; font-weight: 800; }
.reveal-col-total {
  text-align: center; font-family: 'Space Mono', monospace; font-size: 30px; font-weight: 800;
  margin-bottom: 14px; flex-shrink: 0; transition: color .4s;
}
.reveal-grid {
  flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(110px,1fr));
  gap: 8px; align-content: start;
}
.reveal-card {
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px;
  padding: 8px 6px; text-align: center; font-size: 11px; font-weight: 700;
  opacity: 0; transform: scale(.7); animation: cardIn .4s ease forwards;
  position: relative; transition: all .5s ease;
}
@keyframes cardIn { to { opacity: 1; transform: scale(1); } }
.reveal-card.molt {
  border-color: var(--gold); background: rgba(245,158,11,0.15); box-shadow: 0 0 16px rgba(245,158,11,0.3);
  transform: scale(1.08);
}
.reveal-card.spia {
  border-color: var(--red); background: rgba(239,68,68,0.15);
}
.reveal-card.spia.flying {
  animation: spiaFly 1.1s ease forwards;
}
@keyframes spiaFly {
  0% { opacity: 1; transform: scale(1.05); }
  40% { opacity: .3; transform: scale(0.6) translateX(0); }
  100% { opacity: 0; transform: scale(0.3); }
}
.reveal-card-icon { font-size: 16px; display: block; margin-bottom: 3px; }
.reveal-card-tag {
  position: absolute; top: -6px; right: -6px; font-size: 13px;
  background: var(--bg); border-radius: 50%; width: 20px; height: 20px;
  display: flex; align-items: center; justify-content: center; border: 1px solid var(--border);
}

/* Nav atti */
.act-nav {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 150;
  display: flex; align-items: center; gap: 16px;
  background: rgba(21,21,30,0.92); backdrop-filter: blur(12px);
  border: 1.5px solid var(--border); border-radius: 100px; padding: 10px 14px;
}
.act-nav-btn {
  background: var(--surface); border: 1px solid var(--border); color: var(--text);
  width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 18px;
  display: flex; align-items: center; justify-content: center;
}
.act-nav-btn:disabled { opacity: .3; cursor: not-allowed; }
.act-nav-dots { display: flex; gap: 8px; }
.act-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--border); transition: all .3s; }
.act-dot.active { background: var(--gold); width: 24px; border-radius: 100px; }
.act-nav-label { font-family: 'Space Mono', monospace; font-size: 12px; color: var(--text-muted); min-width: 130px; text-align: center; }
</style>
</head>

</div>
<button class="show-ctrl-btn" id="show-ctrl-btn" onclick="showCtrlBar()">⚙️</button>

<div class="stage">

  <div class="view active" id="view-classifica">

      <div class="view-sub" id="lb-sub">— top 8 squadre —</div>

      <div class="slot-team-label" id="slot-label-b" style="color:var(--accent-siria)">SQUADRA B</div>
    </div>

    <div class="slot-controls">
      <button class="slot-btn" id="slot-btn" onclick="avviaEstrazione()">🎲 ESTRAI!</button>
      <button class="slot-btn-secondary" id="slot-reset-btn" onclick="resetEstrazione()" style="display:none;">🔄 Nuova Estrazione</button>
    </div>
  </div>

  <!-- ══ VIEW: REVEAL FAZIONI ══ -->
  <div class="view" id="view-reveal">
    <div class="reveal-wrap">
      <div class="view-header" style="margin-bottom:8px;">
        <div class="view-title" style="font-size:clamp(22px,3vw,34px);">Rivelazione Finale</div>
      </div>
      <div class="reveal-stage-label" id="reveal-stage-label">Atto 1 — Lo Schieramento</div>

        </div>
        <div class="reveal-col siria">
          <div class="reveal-col-head"><img src="badge_team_siria.jpg" alt=""><div class="reveal-col-title" style="color:var(--accent-siria);">Siria</div></div>
          <div class="reveal-col-total" id="reveal-total-siria" style="color:var(--accent-siria);">0</div>
          <div class="reveal-grid" id="reveal-grid-siria"></div>
        </div>
      </div>
    </div>
  </div>

</div>

<div class="act-nav" id="reveal-act-nav" style="display:none;">
  <button class="act-nav-btn" id="act-prev" onclick="prevAct()">◀</button>
  <div class="act-nav-dots">
    <div class="act-dot active" data-act="0"></div>
    <div class="act-dot" data-act="1"></div>
    <div class="act-dot" data-act="2"></div>
    <div class="act-dot" data-act="3"></div>
  </div>
  <button class="act-nav-btn" id="act-next" onclick="nextAct()">▶</button>
  <div class="act-nav-label" id="act-nav-label">Schieramento</div>
</div>

const CAT12_IDS = new Set([
  "b_quiz_location","m_quiz_location","b_registrazione","b_squadra_creata",
  "b_alleanza_vista","b_agente_missione",
  "m_non_registrato","m_squadra_non_creata","m_fazione_non_pescata","m_alleanza_non_vista"
]);
function isMoltiplicabile(id, entry) {
  if (id.startsWith("b_cat2_")) return false;
  if (CAT12_IDS.has(id)) return false;
  if (id.startsWith("custom_") && entry && entry.noCap) return false;
  return true;
}

let punti = {}, teams = {}, fazioni = {}, alleanzaBonusFinale = {};

function getPuntiPersonali(name) {
  const key = sanitize(name);
  if (!punti[key]) return { bonus: 0, malus: 0, tot: 0, bonusFisso: 0, malusFisso: 0, bonusMolt: 0, malusMolt: 0 };
  let bonus = 0, malus = 0, bonusFisso = 0, malusFisso = 0, bonusMolt = 0, malusMolt = 0;
  Object.entries(punti[key]).forEach(([id, e]) => {
    const molt = isMoltiplicabile(id, e);
    if (e.pts > 0) { bonus += e.pts; if (molt) bonusMolt += e.pts; else bonusFisso += e.pts; }
    else { const v = Math.abs(e.pts); malus += v; if (molt) malusMolt += v; else malusFisso += v; }
  });
  return { bonus, malus, tot: bonus - malus, bonusFisso, malusFisso, bonusMolt, malusMolt };
}

function getPuntiSquadra(ownerName) {
  const key = sanitize(ownerName);
  const team = teams[key];
  const extra = (alleanzaBonusFinale[key] && alleanzaBonusFinale[key].pts) || 0;
  if (!team || !team.roster) return { bonus: extra, malus: 0, tot: extra };
  let bonus = 0, malus = 0;
  team.roster.forEach(playerName => {
    const isCap = team.captain === playerName;
    const pp = getPuntiPersonali(playerName);
    const mult = isCap ? 2 : 1;
    bonus += pp.bonusFisso + pp.bonusMolt * mult;
    malus += pp.malusFisso + pp.malusMolt * mult;
  });
  bonus += extra;
  return { bonus, malus, tot: bonus - malus };
}

function getCoeffAlleanza(membri) {
  if (!membri.length) return 0;
  const totBonus = membri.reduce((s, m) => { const p = teams[sanitize(m)] ? getPuntiSquadra(m) : getPuntiPersonali(m); return s + p.bonus; }, 0);
  const totMalus = membri.reduce((s, m) => { const p = teams[sanitize(m)] ? getPuntiSquadra(m) : getPuntiPersonali(m); return s + p.malus; }, 0);
  return (totBonus / membri.length) - (totMalus / membri.length);
}

function getRuoloEffetto(fazioneBase, ruoloId) {
  if (ruoloId === "moltiplicatore_cody" || ruoloId === "moltiplicatore_siria") return { target: fazioneBase, multiplier: 2 };
  if (ruoloId === "spia_cody") return { target: "siria", multiplier: 1 };
  if (ruoloId === "spia_siria") return { target: "cody", multiplier: 1 };
  return { target: fazioneBase, multiplier: 1 };
}

function getPuntiFazioneRaw(faz) {
  let tot = 0;
  PLAYERS.forEach(p => {
    const f = fazioni[sanitize(p.name)];
    if (!f || !f.fazione) return;
    if (f.fazione === faz) tot += getPuntiPersonali(p.name).tot;
  });
  return tot;
}

function getPuntiFazione(faz) {
  let tot = 0;
  PLAYERS.forEach(p => {
    const f = fazioni[sanitize(p.name)];
    if (!f || !f.fazione) return;
    const { target, multiplier } = getRuoloEffetto(f.fazione, f.ruoloId);
    if (target === faz) tot += getPuntiPersonali(p.name).tot * multiplier;
  });
  return tot;
}

// ── BONUS/MALUS PIÙ FREQUENTI ──
// Conta quante volte ogni descrizione di evento è stata assegnata (tra tutti gli ospiti),
// separando bonus (punti positivi) da malus (punti negativi). Eventi automatici Cat.1
// (quiz/registrazione/squadra/alleanza) sono esclusi perché capitano quasi a tutti e
// non sono interessanti come "classifica" — qui contano solo le cose decise da Pietro
// o legate a Cat.2-5/Ad Personam.
function getFrequentiData() {
  const counts = {};
  Object.values(punti).forEach(eventiPersona => {
    Object.entries(eventiPersona || {}).forEach(([id, e]) => {
      if (id.startsWith("custom_")) return; // punti personalizzati sono unici
      // Per i BONUS escludiamo Cat.1 (quiz/registrazione/squadra/alleanza — capitano quasi a tutti)
      // Per i MALUS li includiamo tutti — anche Cat.1 come "non ha risolto quiz" sono interessanti
      if (e.pts > 0 && CAT12_IDS.has(id)) return;
      const desc = e.desc || id;
      if (!counts[desc]) counts[desc] = { count: 0, pts: e.pts, tipo: e.pts > 0 ? "bonus" : "malus" };
      counts[desc].count++;
    });
  });
  const all = Object.entries(counts).map(([desc, v]) => ({ desc, ...v }));
  return {
    bonus: all.filter(x => x.tipo === "bonus").sort((a,b) => b.count - a.count).slice(0, 5),
    malus: all.filter(x => x.tipo === "malus").sort((a,b) => b.count - a.count).slice(0, 5),
  };
}

function buildFreqSectionHtml(title, items, color) {
  if (!items.length) return '<div class="lb-empty">Ancora nessun evento di questo tipo assegnato</div>';
  return `

    ${items.map((x,i) => `
      <div class="lb-row" style="animation-delay:${Math.min(i*0.1,1)}s">

    `).join("")}
  `;
}

// ── AUTO-SCROLL per liste più lunghe dello spazio visibile ──
let scrollAnimFrame = null;
let lbAdvanceTimer = null;

function scheduleAutoScroll() {
  cancelAutoScroll();
  if (lbAdvanceTimer) clearTimeout(lbAdvanceTimer);
  const body = document.getElementById("lb-body");
  const MIN_SLIDE_TIME = 10000;
  requestAnimationFrame(() => {
    const overflow = body.scrollHeight - body.clientHeight;
    if (overflow <= 4) {
      // contenuto già tutto visibile — slide dura il tempo minimo standard
      lbAdvanceTimer = setTimeout(advanceLb, MIN_SLIDE_TIME);
      return;
    }
    // Velocità di scroll più alta per liste molto lunghe (es. Invitati con 68 righe)
    // così il tempo totale di lettura resta ragionevole anche con tanto contenuto.
    const rowCount = body.children.length;
    const SCROLL_SPEED = rowCount > 30 ? 90 : 55; // px/secondo
    const PAUSE_START = 1200;
    const PAUSE_END = 1200;
    const scrollDuration = (overflow / SCROLL_SPEED) * 1000;
    const totalSlideTime = Math.max(MIN_SLIDE_TIME, PAUSE_START + scrollDuration + PAUSE_END + 600);
    lbAdvanceTimer = setTimeout(advanceLb, totalSlideTime);

    let startTs = null;
    function step(ts) {
      if (!startTs) startTs = ts;
      const elapsed = ts - startTs;
      if (elapsed < PAUSE_START) { scrollAnimFrame = requestAnimationFrame(step); return; }
      const scrollElapsed = elapsed - PAUSE_START;
      if (scrollElapsed <= scrollDuration) {
        body.scrollTop = (scrollElapsed / scrollDuration) * overflow;
        scrollAnimFrame = requestAnimationFrame(step);
      } else if (scrollElapsed <= scrollDuration + PAUSE_END) {
        body.scrollTop = overflow;
        scrollAnimFrame = requestAnimationFrame(step);
      }
    }
    scrollAnimFrame = requestAnimationFrame(step);
  });
}
function cancelAutoScroll() {
  if (scrollAnimFrame) cancelAnimationFrame(scrollAnimFrame);
  scrollAnimFrame = null;
}
function advanceLb() {
  cancelAutoScroll();
  stopFreqRotation();
  lbIndex = (lbIndex + 1) % LB_TABS.length;
  renderLb();
}

function startLbRotation() {
  stopLbRotation();
  renderLb();
}
function stopLbRotation() {
  cancelAutoScroll();
  stopFreqRotation();
  if (lbAdvanceTimer) clearTimeout(lbAdvanceTimer);
  lbAdvanceTimer = null;
}

// Rimescola array (Fisher-Yates)
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

window.avviaEstrazione = async function() {
  if (slotRunning) return;
  const fmt = ruotaConfig.formato || 1;
  const totalNeeded = fmt * 2;

  if (nomiPool.length < totalNeeded) {
    alert(`Servono almeno ${totalNeeded} presenti per un ${fmt}v${fmt}. Ora ci sono solo ${nomiPool.length}.`);
    return;
  }

  slotRunning = true;
  document.getElementById("slot-btn").disabled = true;
  document.getElementById("slot-vs-row").style.display = "none";
  document.getElementById("slot-reset-btn").style.display = "none";

  // Pesca random senza ripetizioni
  const pool = shuffle(nomiPool);
  const teamA = pool.slice(0, fmt);
  const teamB = pool.slice(fmt, fmt * 2);

  // Anima ogni slot in sequenza
  const allSlots = [
    ...teamA.map((name, i) => ({ team: "a", idx: i, name })),
    ...teamB.map((name, i) => ({ team: "b", idx: i, name })),
  ];

  // Mischia l'ordine di atterraggio per più drammaticità
  const ordine = shuffle(allSlots);

  for (let s = 0; s < ordine.length; s++) {
    await animaSlot(ordine[s].team, ordine[s].idx, ordine[s].name, s * 600);
  }

  // Attendi che finiscano tutte
  await new Promise(r => setTimeout(r, ordine.length * 600 + 1800));

  // Mostra etichette VS
  document.getElementById("slot-label-a").textContent = teamA.join(" & ");
  document.getElementById("slot-label-b").textContent = teamB.join(" & ");
  document.getElementById("slot-vs-row").style.display = "flex";
  document.getElementById("slot-reset-btn").style.display = "";
  document.getElementById("slot-btn").style.display = "none";

  slotRunning = false;
};

function animaSlot(team, idx, winnerName, delay) {
  return new Promise(resolve => {
    setTimeout(() => {
      const reel = document.getElementById(`slot-reel-${team}-${idx}`);
      const win = document.getElementById(`slot-win-${team}-${idx}`);

      // Costruisci nastro: 20 nomi random + il vincitore alla fine
      const nastro = shuffle([...nomiPool, ...nomiPool, ...nomiPool])
        .slice(0, 22)
        .concat([winnerName]);

      reel.innerHTML = "";
      nastro.forEach((name, i) => {
        const item = document.createElement("div");
        item.className = "slot-item" + (i === nastro.length - 1 ? " winner" : "");
        item.textContent = name.split(" ")[0]; // solo nome di battesimo durante lo scroll
        reel.appendChild(item);
      });

      const ITEM_H = 90;
      const totalH = nastro.length * ITEM_H;
      const finalOffset = (nastro.length - 1) * ITEM_H;

      // Anima: scrolla veloce poi frena sul vincitore
      const duration = 1400; // ms
      const startTime = performance.now();

      function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

      function step(now) {
        const elapsed = now - startTime;
        const t = Math.min(elapsed / duration, 1);
        const pos = easeOut(t) * finalOffset;
        reel.style.transform = `translateY(-${pos}px)`;
        if (t < 1) {
          requestAnimationFrame(step);
        } else {
          // Atterrato!
          reel.style.transform = `translateY(-${finalOffset}px)`;
          // Mostra nome completo
          const lastItem = reel.lastChild;
          lastItem.textContent = winnerName;
          lastItem.style.fontSize = "18px";
          win.classList.add("landed");
          resolve();
        }
      }
      requestAnimationFrame(step);
    }, delay);
  });
}

window.resetEstrazione = function() {
  const fmt = ruotaConfig.formato || 1;
  buildSlotArena(fmt);
};

// ══════════════════════════════════════
// REVEAL FAZIONI — 4 ATTI
// ══════════════════════════════════════
const ACT_LABELS = ["Schieramento", "I Moltiplicatori", "Le Spie", "Ribaltone Finale"];
const ACT_STAGE_TITLES = [
  "Atto 1 — Lo Schieramento",
  "Atto 2 — I Moltiplicatori si Rivelano",
  "Atto 3 — Tradimento! Le Spie",
  "Atto 4 — La Classifica Definitiva",
];
let currentAct = 0;
let revealBuilt = false;

function buildRevealCards() {
  const gridCody = document.getElementById("reveal-grid-cody");
  const gridSiria = document.getElementById("reveal-grid-siria");
  gridCody.innerHTML = ""; gridSiria.innerHTML = "";

  let i = 0;
  PLAYERS.forEach(p => {
    const f = fazioni[sanitize(p.name)];
    if (!f || !f.fazione) return;
    const card = document.createElement("div");
    card.className = "reveal-card";
    card.dataset.name = p.name;
    card.dataset.ruolo = f.ruoloId || "soldato_" + f.fazione;
    card.dataset.fazione = f.fazione;
    card.style.animationDelay = (i * 0.025) + "s";
    card.innerHTML = `<span class="reveal-card-icon">👤</span>${p.name.split(" ")[0]}`;
    (f.fazione === "cody" ? gridCody : gridSiria).appendChild(card);
    i++;
  });
}

function applyAct0() {
  // Schieramento puro — nessuna icona speciale
  document.querySelectorAll(".reveal-card").forEach(c => {
    c.className = "reveal-card";
    c.querySelector(".reveal-card-icon").textContent = "👤";
    const tag = c.querySelector(".reveal-card-tag");
    if (tag) tag.remove();
  });
  document.getElementById("reveal-total-cody").textContent = getPuntiFazioneRaw("cody");
  document.getElementById("reveal-total-siria").textContent = getPuntiFazioneRaw("siria");
}

function applyAct1() {
  // Moltiplicatori si illuminano
  document.querySelectorAll(".reveal-card").forEach(c => {
    if (c.dataset.ruolo.startsWith("moltiplicatore")) {
      c.classList.add("molt");
      c.querySelector(".reveal-card-icon").textContent = c.dataset.fazione === "cody" ? "👨‍🍳" : "❤️";
      if (!c.querySelector(".reveal-card-tag")) {
        const tag = document.createElement("div");
        tag.className = "reveal-card-tag"; tag.textContent = "×2";
        c.appendChild(tag);
      }
    }
  });
}

function applyAct2() {
  // Spie "volano" verso la fazione nemica
  const cody = document.getElementById("reveal-grid-cody");
  const siria = document.getElementById("reveal-grid-siria");
  document.querySelectorAll(".reveal-card").forEach(c => {
    if (c.dataset.ruolo.startsWith("spia")) {
      c.classList.add("spia");
      c.querySelector(".reveal-card-icon").textContent = "🕵️";
      if (!c.querySelector(".reveal-card-tag")) {
        const tag = document.createElement("div");
        tag.className = "reveal-card-tag"; tag.textContent = "🔄";
        c.appendChild(tag);
      }
      setTimeout(() => {
        c.classList.add("flying");
        setTimeout(() => {
          const targetGrid = c.dataset.fazione === "cody" ? siria : cody;
          c.classList.remove("flying");
          c.style.opacity = "1"; c.style.transform = "scale(1)";
          c.querySelector(".reveal-card-tag").textContent = "🕵️";
          targetGrid.appendChild(c);
        }, 1050);
      }, 400);
    }
  });
}

function applyAct3() {
  // Ribaltone — totali finali con moltiplicatori + spie
  const finalCody = getPuntiFazione("cody");
  const finalSiria = getPuntiFazione("siria");
  animateCounter("reveal-total-cody", finalCody);
  animateCounter("reveal-total-siria", finalSiria);
}

function animateCounter(elId, target) {
  const el = document.getElementById(elId);
  const start = parseInt(el.textContent) || 0;
  const duration = 1200;
  const startTime = performance.now();
  function step(now) {
    const progress = Math.min(1, (now - startTime) / duration);
    const val = Math.round(start + (target - start) * progress);
    el.textContent = val;
    if (progress < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function renderAct() {
  document.getElementById("reveal-stage-label").textContent = ACT_STAGE_TITLES[currentAct];
  document.getElementById("act-nav-label").textContent = ACT_LABELS[currentAct];
  document.querySelectorAll(".act-dot").forEach((d,i) => d.classList.toggle("active", i === currentAct));
  document.getElementById("act-prev").disabled = currentAct === 0;
  document.getElementById("act-next").disabled = currentAct === 3;

  if (currentAct === 0) applyAct0();
  else if (currentAct === 1) applyAct1();
  else if (currentAct === 2) applyAct2();
  else if (currentAct === 3) applyAct3();
}

window.nextAct = function() {
  if (currentAct >= 3) return;
  currentAct++;
  renderAct();
};
window.prevAct = function() {
  if (currentAct <= 0) return;
  currentAct--;
  if (!revealBuilt) return;
  buildRevealCards();
  for (let i = 0; i <= currentAct; i++) {
    if (i === 0) applyAct0();
    else if (i === 1) applyAct1();
    else if (i === 2 && currentAct < 2) applyAct2(); // non rifare il volo se torniamo prima di act2
  }
  renderAct();
};

// ══════════════════════════════════════
// INIT
// ══════════════════════════════════════
function init() {
  // Al primissimo arrivo dei dati (subito dopo l'apertura della pagina), i dati Firebase
  // arrivano DOPO che startLbRotation() ha già fatto il primo render (a vuoto).
  // Per questo, finché non è arrivato il primo dataset completo, usiamo renderLb() pieno
  // (che riattiva scroll automatico e timer) invece del solo refresh contenuto.
  let firstDataLoaded = { punti: false, teams: false };
  function maybeFullRenderOrRefresh() {
    if (!firstDataLoaded.punti || !firstDataLoaded.teams) return; // aspetta che arrivino entrambi
    if (!initialRenderDone) {
      initialRenderDone = true;
      if (LB_TABS[lbIndex]) renderLb(); // primo render vero coi dati reali → attiva scroll/timer
    } else {
      refreshCurrentLbContent();
    }
  }

  onValue(ref(db, "punti"), snap => {
    punti = snap.exists() ? snap.val() : {};
    firstDataLoaded.punti = true;
    maybeFullRenderOrRefresh();
  });
  onValue(ref(db, "teams"), snap => {
    teams = snap.exists() ? snap.val() : {};
    firstDataLoaded.teams = true;
    maybeFullRenderOrRefresh();
  });
  onValue(ref(db, "fazioni"), snap => {
    fazioni = snap.exists() ? snap.val() : {};
    refreshCurrentLbContent();
    if (document.getElementById("view-reveal").classList.contains("active") && !revealBuilt) {
      buildRevealCards();
      revealBuilt = true;
      renderAct();
    }
  });
  onValue(ref(db, "alleanzaBonusFinale"), snap => { alleanzaBonusFinale = snap.exists() ? snap.val() : {}; refreshCurrentLbContent(); });

  // Carica config ruota da Firebase (aggiornata in tempo reale quando admin salva)
  onValue(ref(db, "ruotaConfig"), snap => {
    if (snap.exists()) {
      ruotaConfig = snap.val();
      if (!ruotaConfig.presenti) ruotaConfig.presenti = {};
    }
    aggiornaPool();
  });

  // Costruisci il reveal alla prima apertura della tab
  const origSetView = window.setView;
  window.setView = function(v) {
    origSetView(v);
    if (v === "reveal" && !revealBuilt) {
      buildRevealCards();
      revealBuilt = true;
      currentAct = 0;
      renderAct();
    }
  };
}

init();
</script>
