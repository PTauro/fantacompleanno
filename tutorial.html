<title>FantaCompleanno — Tutorial</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700;800&family=Space+Mono:wght@400;700&display=swap');

:root {
  --bg: #0a0a0f; --surface: #13131a; --border: #1e1e2e;
  --accent-cody: #ff6b2b; --accent-siria: #a855f7;
  --text: #f0f0f5; --text-muted: #6b6b8a;
  --green: #22c55e; --red: #ef4444; --gold: #f59e0b;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Space Grotesk', sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; overflow-x: hidden;
  display: flex; flex-direction: column;
}

/* ── TOP BAR ── */
.topbar {
  padding: 14px 20px; display: flex; align-items: center; gap: 10px;
}
.progress-dots { display: flex; gap: 6px; flex: 1; }
.dot { flex: 1; height: 4px; border-radius: 2px; background: var(--border); transition: background .3s; }
.dot.done { background: linear-gradient(90deg, var(--accent-cody), var(--accent-siria)); }
.btn-skip {
  font-family: 'Space Mono', monospace; font-size: 11px; color: var(--text-muted);
  background: none; border: none; cursor: pointer; letter-spacing: .05em; padding: 6px 4px;
}
.btn-close {
  background: var(--surface); border: 1.5px solid var(--border);
  color: var(--text-muted); width: 32px; height: 32px; border-radius: 9px;
  font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; text-decoration: none;
}

/* ── SLIDES ── */
.slides-wrap { flex: 1; position: relative; overflow: hidden; }
.slide {
  position: absolute; inset: 0; padding: 10px 24px 100px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; opacity: 0; transform: translateX(40px);
  transition: opacity .35s ease, transform .35s ease; pointer-events: none;
}
.slide.active { opacity: 1; transform: translateX(0); pointer-events: auto; }
.slide.prev { transform: translateX(-40px); }

.slide-emoji { font-size: 64px; margin-bottom: 20px; }
.slide-label {
  font-family: 'Space Mono', monospace; font-size: 11px;
  color: var(--accent-siria); letter-spacing: .15em; text-transform: uppercase; margin-bottom: 10px;
}
.slide-title { font-size: 24px; font-weight: 800; margin-bottom: 14px; line-height: 1.25; }
.slide-text { font-size: 14px; color: var(--text-muted); line-height: 1.7; max-width: 340px; }
.slide-text strong { color: var(--text); }
.slide-text .cody { color: var(--accent-cody); font-weight: 700; }
.slide-text .siria { color: var(--accent-siria); font-weight: 700; }

.slide-card {
  background: var(--surface); border: 1.5px solid var(--border);
  border-radius: 14px; padding: 14px 16px; margin-top: 18px; max-width: 340px; width: 100%;
  text-align: left; font-size: 12px; color: var(--text-muted); line-height: 1.6;
}
.slide-card strong { color: var(--text); }
.slide-formula {
  font-family: 'Space Mono', monospace; font-size: 13px; text-align: center;
  background: rgba(168,85,247,0.08); border: 1px solid rgba(168,85,247,0.25);
  border-radius: 10px; padding: 10px 14px; margin-top: 14px; max-width: 340px; width: 100%;
  color: var(--accent-siria);
}

/* ── NAV BUTTONS ── */
.nav-buttons {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
  background: rgba(10,10,15,0.97); backdrop-filter: blur(12px);
  border-top: 1px solid var(--border);
  padding: 16px 20px calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; gap: 10px;
}
.btn-prev {
  background: var(--surface); border: 1.5px solid var(--border);
  color: var(--text-muted); padding: 16px 20px; border-radius: 12px;
  font-family: 'Space Grotesk', sans-serif; font-size: 15px; cursor: pointer;
}
.btn-next {
  flex: 1; background: linear-gradient(135deg, var(--accent-cody), var(--accent-siria));
  color: white; padding: 16px; border-radius: 12px; border: none;
  font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 700;
  cursor: pointer; transition: opacity .2s;
}
.btn-next:hover { opacity: .85; }

/* ── FAZIONE BUSTA (ultimo step) ── */
.busta-wrap {
  width: 220px; height: 220px; position: relative;
  cursor: pointer; margin-bottom: 24px;
  filter: drop-shadow(0 0 40px rgba(168,85,247,0.3));
}
.busta { width: 100%; height: 100%; position: relative; }
.busta-corpo {
  position: absolute; bottom: 0; left: 0; right: 0;
  height: 160px; background: var(--surface);
  border: 2px solid rgba(168,85,247,0.5);
  border-radius: 0 0 16px 16px; overflow: hidden;
}
.busta-corpo::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(168,85,247,0.08), rgba(255,107,43,0.08));
}
.busta-lembo {
  position: absolute; top: 64px; left: 0; right: 0;
  width: 0; height: 0;
  border-left: 110px solid transparent;
  border-right: 110px solid transparent;
  border-top: 96px solid var(--surface);
  filter: drop-shadow(0 2px 4px rgba(168,85,247,0.2));
  transform-origin: top center;
  transition: transform .6s cubic-bezier(.4,0,.2,1);
  z-index: 10;
}
.busta-lembo.aperto { transform: rotateX(180deg); }
.busta-diag-sx {
  position: absolute; top: 160px; left: 0; width: 0; height: 0;
  border-bottom: 80px solid rgba(168,85,247,0.15);
  border-right: 110px solid transparent;
}
.busta-diag-dx {
  position: absolute; top: 160px; right: 0; width: 0; height: 0;
  border-bottom: 80px solid rgba(168,85,247,0.15);
  border-left: 110px solid transparent;
}
.sigillo {
  position: absolute; top: 128px; left: 50%; transform: translateX(-50%);
  width: 42px; height: 42px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent-cody), var(--accent-siria));
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; z-index: 20;
  box-shadow: 0 0 20px rgba(168,85,247,0.5);
  animation: glow 2s infinite; transition: opacity .3s;
}
@keyframes glow { 0%,100% { box-shadow: 0 0 20px rgba(168,85,247,0.5); } 50% { box-shadow: 0 0 40px rgba(168,85,247,0.8); } }
.carta-preview {
  position: absolute; bottom: 48px; left: 50%; transform: translateX(-50%) translateY(48px);
  width: 110px; height: 142px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 48px; z-index: 5; opacity: 0;
  transition: transform .6s cubic-bezier(.4,0,.2,1), opacity .3s;
}
.carta-preview.esce { transform: translateX(-50%) translateY(0px); opacity: 1; }
.carta-preview.cody-preview { background: linear-gradient(135deg, #1a0800, #2d1200); border: 2px solid rgba(255,107,43,0.5); }
.carta-preview.siria-preview { background: linear-gradient(135deg, #0d0020, #1a0035); border: 2px solid rgba(168,85,247,0.5); }

.particle {
  position: fixed; pointer-events: none; z-index: 100;
  width: 8px; height: 8px; border-radius: 50%;
  animation: particle-fly 1.5s ease-out forwards;
}
@keyframes particle-fly {
  0% { transform: translate(0,0) scale(1); opacity: 1; }
  100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
}

/* ── CARTA RIVELATA ── */
.carta-revealed {
  width: 280px; border-radius: 18px; padding: 24px 20px;
  text-align: center; margin-bottom: 16px;
  animation: cardReveal .6s cubic-bezier(.4,0,.2,1);
}
@keyframes cardReveal { 0% { transform: scale(0.8) rotateY(90deg); opacity: 0; } 100% { transform: scale(1) rotateY(0deg); opacity: 1; } }
.carta-cody { background: linear-gradient(135deg, #1a0800, #2d1200, #1a0800); border: 2px solid var(--accent-cody); box-shadow: 0 0 40px rgba(255,107,43,0.3); }
.carta-siria { background: linear-gradient(135deg, #0d0020, #1a0035, #0d0020); border: 2px solid var(--accent-siria); box-shadow: 0 0 40px rgba(168,85,247,0.3); }
.carta-emoji { font-size: 56px; display: block; margin-bottom: 10px; }
.carta-fazione-label { font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: .2em; text-transform: uppercase; margin-bottom: 6px; opacity: .7; }
.carta-fazione-name { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
.carta-cody .carta-fazione-name { color: var(--accent-cody); }
.carta-siria .carta-fazione-name { color: var(--accent-siria); }
.carta-ruolo-label { font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: .15em; text-transform: uppercase; opacity: .5; margin-top: 14px; margin-bottom: 4px; }
.carta-ruolo-name { font-size: 16px; font-weight: 800; margin-bottom: 8px; }
.carta-ruolo-desc { font-size: 11px; color: var(--text-muted); line-height: 1.6; font-style: italic; padding: 0 4px; }
.carta-regola { margin-top: 12px; padding: 10px 14px; border-radius: 10px; font-family: 'Space Mono', monospace; font-size: 11px; line-height: 1.5; }
.carta-cody .carta-regola { background: rgba(255,107,43,0.15); color: var(--accent-cody); }
.carta-siria .carta-regola { background: rgba(168,85,247,0.15); color: var(--accent-siria); }
.segreto-badge {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3);
  color: var(--red); font-family: 'Space Mono', monospace; font-size: 10px;
  padding: 5px 12px; border-radius: 100px; margin-top: 10px; letter-spacing: .1em;
}
</style>

function renderDots() {
  const wrap = document.getElementById("progress-dots");
  wrap.innerHTML = "";
  SLIDES.forEach((_, i) => {
    const d = document.createElement("div");
    d.className = "dot" + (i <= current ? " done" : "");
    wrap.appendChild(d);
  });
}

function renderSlide() {
  const wrap = document.getElementById("slides-wrap");
  wrap.innerHTML = "";

  const s = SLIDES[current];
  const div = document.createElement("div");
  div.className = "slide active";

  if (s.isFazione) {
    div.innerHTML = `
      <div class="slide-label">${s.label}</div>
      <div class="slide-title">${s.title}</div>
      <div class="slide-text" style="margin-bottom:20px;">${s.text}</div>
      <div class="busta-wrap" id="busta-wrap">
        <div class="busta">
          <div class="busta-lembo" id="busta-lembo"></div>
          <div class="carta-preview" id="carta-preview">🏠</div>
          <div class="busta-corpo"><div class="busta-diag-sx"></div><div class="busta-diag-dx"></div></div>
          <div class="sigillo" id="sigillo">⚔️</div>
        </div>
      </div>
    `;
  } else {
    div.innerHTML = `
      <div class="slide-emoji">${s.emoji}</div>
      <div class="slide-label">${s.label}</div>
      <div class="slide-title">${s.title}</div>
      <div class="slide-text">${s.text}</div>
      ${s.formula ? `<div class="slide-formula">${s.formula}</div>` : ''}
      ${s.card ? `<div class="slide-card">${s.card}</div>` : ''}
    `;
  }

  wrap.appendChild(div);

  // Bottoni
  document.getElementById("btn-prev").style.display = current === 0 ? "none" : "block";
  document.getElementById("btn-skip").style.display = current === SLIDES.length - 1 ? "none" : "block";

  const nextBtn = document.getElementById("btn-next");
  if (s.isFazione) {
    nextBtn.textContent = "✉️ Apri la busta";
    nextBtn.onclick = apriBusta;
    nextBtn.style.display = fazioneCompleted ? "none" : "block";
    if (fazioneCompleted) {
      // Mostra "vai al gioco" se già completato
      showFazioneResultIfDone();
    }
  } else if (current === SLIDES.length - 2) {
    nextBtn.textContent = "Continua →";
    nextBtn.onclick = nextSlide;
    nextBtn.style.display = "block";
  } else {
    nextBtn.textContent = "Avanti →";
    nextBtn.onclick = nextSlide;
    nextBtn.style.display = "block";
  }

  renderDots();
}

window.nextSlide = function() {
  if (current < SLIDES.length - 1) {
    current++;
    renderSlide();
  }
};

window.prevSlide = function() {
  if (current > 0) {
    current--;
    renderSlide();
  }
};

window.goToLast = function() {
  current = SLIDES.length - 1;
  renderSlide();
};

// ── BUSTA FAZIONE ──
window.apriBusta = async function() {
  const btn = document.getElementById("btn-next");
  btn.disabled = true;
  btn.textContent = "⏳ Apertura in corso...";

  document.getElementById("busta-lembo").classList.add("aperto");
  document.getElementById("sigillo").style.opacity = "0";
  await sleep(600);

  const costo = PLAYER_COSTS[myName] || 50;
  const fazione = Math.random() < 0.5 ? "cody" : "siria";
  const ruolo = estraiRuolo(fazione, costo);

  const preview = document.getElementById("carta-preview");
  preview.className = `carta-preview ${fazione}-preview esce`;
  preview.textContent = fazione === "cody" ? "🐕" : "🐱";
  await sleep(800);

  spawnParticles(fazione);
  await sleep(400);

  const key = sanitize(myName);
  await set(ref(db, `fazioni/${key}`), { fazione, ruoloId: ruolo.id, nome: myName, ts: Date.now() });
  await sleep(300);

  fazioneCompleted = true;
  renderCartaRivelata(fazione, ruolo);
};

function renderCartaRivelata(fazione, ruolo) {
  const wrap = document.getElementById("slides-wrap");
  const isCody = fazione === "cody";
  const fazioneNome = isCody ? "🐕 Team Cody" : "🐱 Team Siria";
  const fazioneClass = isCody ? "carta-cody" : "carta-siria";
  const isSpeciale = ruolo.effetto !== "x1";

  const div = document.createElement("div");
  div.className = "slide active";
  div.innerHTML = `
    <div class="carta-revealed ${fazioneClass}">
      <span class="carta-emoji">${isCody ? "🐕" : "🐱"}</span>
      <div class="carta-fazione-label">Sei nel</div>
      <div class="carta-fazione-name">${fazioneNome}</div>
      <div class="carta-ruolo-label">Il tuo ruolo</div>
      <div class="carta-ruolo-name">${ruolo.nome}</div>
      <div class="carta-ruolo-desc">"${ruolo.desc}"</div>
      <div class="carta-regola">${ruolo.regola}</div>
      ${isSpeciale ? `<div class="segreto-badge">🔒 Ruolo Speciale — Non rivelare</div>` : ''}
    </div>
    <div class="segreto-badge" style="margin-bottom:8px;">🔒 Non rivelare la tua fazione — -80 pt</div>
  `;
  wrap.innerHTML = "";
  wrap.appendChild(div);

  const btn = document.getElementById("btn-next");
  btn.disabled = false;
  btn.textContent = "🏠 Vai alla Home →";
  btn.onclick = () => {
    localStorage.setItem("fc_tutorial_done", "1");
    window.location.replace("home.html");
  };
  document.getElementById("btn-prev").style.display = "none";
  document.getElementById("btn-skip").style.display = "none";
}

async function showFazioneResultIfDone() {
  // Se l'utente torna sull'ultima slide dopo aver già aperto la busta
  const key = sanitize(myName);
  const snap = await get(ref(db, `fazioni/${key}`));
  if (snap.exists()) {
    const saved = snap.val();
    let ruolo = null;
    for (const tipo of ['soldato','moltiplicatore','spia']) {
      if (RUOLI[saved.fazione][tipo].id === saved.ruoloId) { ruolo = RUOLI[saved.fazione][tipo]; break; }
    }
    if (!ruolo) ruolo = RUOLI[saved.fazione].soldato;
    fazioneCompleted = true;
    renderCartaRivelata(saved.fazione, ruolo);
  }
}

function spawnParticles(fazione) {
  const colors = fazione === "cody" ? ["#ff6b2b","#ff8c55","#ffb38a","#f59e0b"] : ["#a855f7","#c084fc","#e879f9","#7c3aed"];
  for (let i = 0; i < 18; i++) {
    const p = document.createElement("div");
    p.className = "particle";
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.left = (35 + Math.random() * 30) + "vw";
    p.style.top = (40 + Math.random() * 20) + "vh";
    const angle = Math.random() * Math.PI * 2;
    const dist = 70 + Math.random() * 100;
    p.style.setProperty("--tx", Math.cos(angle) * dist + "px");
    p.style.setProperty("--ty", Math.sin(angle) * dist + "px");
    p.style.animationDelay = Math.random() * 0.3 + "s";
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 2000);
  }
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ── INIT ──
async function init() {
  // Mostra il tasto chiusura solo se è una rivisita volontaria (tutorial già completato in passato)
  if (localStorage.getItem("fc_tutorial_done") === "1") {
    document.getElementById("btn-close").style.display = "flex";
  }
  // Se la fazione è già stata estratta, segnalo per l'ultima slide
  const key = sanitize(myName);
  const snap = await get(ref(db, `fazioni/${key}`));
  if (snap.exists()) fazioneCompleted = true;
  renderSlide();
}

init();
</script>
