.busta-corpo {

  background: linear-gradient(135deg, rgba(168,85,247,0.08), rgba(255,107,43,0.08));
}

/* Lembo busta (triangolo sopra) */
.busta-lembo {

  border-right: 140px solid transparent;
  border-top: 120px solid var(--surface);

  transform-origin: top center;
  transition: transform .6s cubic-bezier(.4,0,.2,1);
  z-index: 10;
}
.busta-lembo.aperto {
  transform: rotateX(180deg);
}

/* Linee diagonali busta */
.busta-diag-sx {
  position: absolute; top: 200px; left: 0;
  width: 0; height: 0;

.busta-diag-dx {

  width: 0; height: 0;
  border-bottom: 100px solid rgba(168,85,247,0.15);
  border-left: 140px solid transparent;

function sanitize(s) { return s.replace(/[.#$[\]]/g, "_"); }

// ── ESTRAI FAZIONE ──
// ── ESTRAZIONE RUOLO (a riempimento, cap fisso 3+3 per fazione) ──
// Probabilità per costo: ≥150 → 50%, 110-149 → 25%, <110 → 8%
// Se i posti speciali (3 molt + 3 spie per fazione) sono esauriti → sempre soldato
async function estraiRuolo(fazione, costo) {
  // Conta ruoli speciali già assegnati in questa fazione
  const snapFaz = await get(ref(db, "fazioni"));
  const tutti = snapFaz.exists() ? Object.values(snapFaz.val()) : [];
  const miaFazione = tutti.filter(f => f.fazione === fazione);
  const nMolt = miaFazione.filter(f => f.ruoloId && f.ruoloId.startsWith("moltiplicatore")).length;
  const nSpia = miaFazione.filter(f => f.ruoloId && f.ruoloId.startsWith("spia")).length;

  const MAX = 3; // max per tipo per fazione
  const postiMolt = MAX - nMolt;
  const postiSpia = MAX - nSpia;
  const postiTot = postiMolt + postiSpia;

  // Se non ci sono più posti speciali → soldato
  if (postiTot <= 0) return RUOLI[fazione].soldato;

  // Probabilità basata sul costo
  const prob = costo >= 150 ? 0.50 : costo >= 110 ? 0.25 : 0.08;
  if (Math.random() >= prob) return RUOLI[fazione].soldato;

  // Pesca il tipo di ruolo disponibile (equamente se entrambi disponibili)
  const scegliMolt = postiMolt > 0 && (postiSpia === 0 || Math.random() < 0.5);
  if (scegliMolt) return RUOLI[fazione].moltiplicatore;
  return RUOLI[fazione].spia;
}

    // Già estratta — mostra direttamente la carta
    const saved = snap.val();
    mostraCartaDirectly(saved);
  }
  // Altrimenti: schermata busta normale
}

function mostraCartaDirectly(saved) {
  // Salta animazione busta, mostra carta subito
  showScreen('screen-carta');
  renderCarta(saved.fazione, saved.ruoloId);
}

// ── ANIMAZIONE BUSTA ──
window.apriBusta = async function() {
  const btn = document.getElementById("btn-apri");
  btn.disabled = true;
  btn.textContent = "⏳ Apertura in corso...";

  // 1. Apri lembo
  document.getElementById("busta-lembo").classList.add("aperto");
  document.getElementById("sigillo").style.opacity = "0";

  await sleep(600);

  // 2. Determina fazione e ruolo
  const costo = PLAYER_COSTS[myName] || 50;
  const fazione = Math.random() < 0.5 ? "cody" : "siria";
  const ruolo = await estraiRuolo(fazione, costo);

  // 3. Anteprima carta che esce
  const preview = document.getElementById("carta-preview");
  preview.className = `carta-preview ${fazione}-preview esce`;
  preview.innerHTML = `<img src="badge_team_${fazione}.jpg" alt="" style="width:90px;height:90px;border-radius:10px;object-fit:cover;">`;

  await sleep(800);

  // 4. Particelle
  spawnParticles(fazione);

  await sleep(400);

  // 5. Salva su Firebase
  const key = sanitize(myName);
  await set(ref(db, `fazioni/${key}`), {
    fazione,
    ruoloId: ruolo.id,
    nome: myName,
    ts: Date.now()
  });

  await sleep(300);

  // 6. Mostra carta
  showScreen('screen-carta');
  renderCarta(fazione, ruolo.id);
};

function renderCarta(fazione, ruoloId) {
  // Trova ruolo dai dati
  let ruolo = null;
  for (const tipo of ['soldato','moltiplicatore','spia']) {
    if (RUOLI[fazione][tipo].id === ruoloId) {
      ruolo = RUOLI[fazione][tipo];
      break;
    }
  }
  // Fallback
  if (!ruolo) ruolo = RUOLI[fazione].soldato;

  const isCody = fazione === "cody";
  const fazioneNome = isCody ? "Team Cody" : "Team Siria";
  const fazione_class = isCody ? "carta-cody" : "carta-siria";
  const isSpeciale = ruolo.effetto !== "x1";

  const container = document.getElementById("carta-container");
  container.innerHTML = `
    <div class="carta-revealed ${fazione_class}">
      <img class="carta-ruolo-icon" src="${ruolo.img}" alt="${ruolo.nome}">
      <div class="carta-fazione-label">Sei nel</div>
      <div class="carta-fazione-row">
        <img class="carta-team-badge" src="badge_team_${fazione}.jpg" alt="">
        <div class="carta-fazione-name">${fazioneNome}</div>
      </div>

      <div class="carta-ruolo-label">Il tuo ruolo</div>
      <div class="carta-ruolo-name">${ruolo.nome}</div>
      <div class="carta-ruolo-desc">"${ruolo.desc}"</div>

      <div class="carta-regola">${ruolo.regola}</div>

      ${isSpeciale ? `<div class="segreto-badge">🔒 Ruolo Speciale — Non rivelare</div>` : ''}
    </div>
    <div class="segreto-badge" style="margin-bottom:12px;">🔒 Non rivelare la tua fazione — -80 pt</div>
  `;
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

function spawnParticles(fazione) {
  const colors = fazione === "cody"
    ? ["#ff6b2b","#ff8c55","#ffb38a","#f59e0b"]
    : ["#a855f7","#c084fc","#e879f9","#7c3aed"];

  for (let i = 0; i < 20; i++) {
    const p = document.createElement("div");
    p.className = "particle";
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.left = (30 + Math.random() * 40) + "vw";
    p.style.top = (30 + Math.random() * 30) + "vh";
    const angle = Math.random() * Math.PI * 2;
    const dist = 80 + Math.random() * 120;
    p.style.setProperty("--tx", Math.cos(angle) * dist + "px");
    p.style.setProperty("--ty", Math.sin(angle) * dist + "px");
    p.style.animationDelay = Math.random() * 0.3 + "s";
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 2000);
  }
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

init();
</script>
