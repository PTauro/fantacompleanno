<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FantaCompleanno — Draft Squadra</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700;800&family=Space+Mono:wght@400;700&display=swap');

:root {
  --bg: #0a0a0f; --surface: #13131a; --border: #1e1e2e;
  --accent-cody: #ff6b2b; --accent-siria: #a855f7;
  --text: #f0f0f5; --text-muted: #6b6b8a;
  --green: #22c55e; --red: #ef4444; --gold: #f59e0b;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Space Grotesk', sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; padding-bottom: 100px;
}

/* ── NAV ── */
.nav {
  position: sticky; top: 0; z-index: 50;
  background: rgba(10,10,15,0.95); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px; display: flex; align-items: center; justify-content: space-between;
}
.nav-title { font-family: 'Space Mono', monospace; font-size: 13px; color: var(--text-muted); }
.nav-name { font-size: 15px; font-weight: 700; }

/* ── BUDGET BAR ── */
.budget-bar {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 14px 20px;
}
.budget-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.budget-label { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--text-muted); letter-spacing: .1em; }
.budget-amount { font-family: 'Space Mono', monospace; font-size: 20px; font-weight: 700; }
.budget-amount.ok { color: var(--green); }
.budget-amount.warn { color: var(--gold); }
.budget-amount.over { color: var(--red); }
.bar-track { width: 100%; height: 4px; background: var(--border); border-radius: 2px; }
.bar-fill { height: 100%; border-radius: 2px; transition: width .3s ease, background .3s; }

/* ── TABS ── */
.tabs {
  display: flex; border-bottom: 1px solid var(--border);
  background: var(--surface); position: sticky; top: 57px; z-index: 40;
}
.tab {
  flex: 1; padding: 12px; text-align: center;
  font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700;
  color: var(--text-muted); cursor: pointer; transition: all .2s;
  border-bottom: 2px solid transparent;
}
.tab.active { color: var(--accent-cody); border-bottom-color: var(--accent-cody); }

/* ── CONTENT ── */
.tab-content { display: none; padding: 16px 20px; }
.tab-content.active { display: block; }

/* ── SEARCH ── */
.search-wrap { position: relative; margin-bottom: 12px; }
.search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 15px; pointer-events: none; }
.search-input {
  width: 100%; background: var(--surface); border: 1.5px solid var(--border);
  border-radius: 10px; padding: 12px 12px 12px 40px;
  color: var(--text); font-family: 'Space Grotesk', sans-serif;
  font-size: 14px; outline: none; transition: border-color .2s;
}
.search-input:focus { border-color: var(--accent-siria); }
.search-input::placeholder { color: var(--text-muted); }

/* ── PLAYER CARDS ── */
.player-grid { display: flex; flex-direction: column; gap: 8px; }

.player-card {
  background: var(--surface); border: 1.5px solid var(--border);
  border-radius: 12px; padding: 14px 16px;
  display: flex; align-items: center; gap: 12px;
  cursor: pointer; transition: all .2s;
}
.player-card:hover { border-color: var(--accent-cody); background: #150a00; }
.player-card.selected { border-color: var(--accent-cody); background: #150a00; }
.player-card.captain { border-color: var(--gold); background: #150d00; }
.player-card.disabled { opacity: 0.4; cursor: not-allowed; pointer-events: none; }
.player-card.full:not(.selected) { opacity: 0.5; cursor: not-allowed; pointer-events: none; }

.player-avatar {
  width: 40px; height: 40px; border-radius: 10px;
  background: var(--border); display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 800; font-family: 'Space Mono', monospace;
  color: var(--text-muted); flex-shrink: 0; transition: all .2s;
}
.player-card.selected .player-avatar { background: rgba(255,107,43,0.2); color: var(--accent-cody); }
.player-card.captain .player-avatar { background: rgba(245,158,11,0.2); color: var(--gold); }

.player-info { flex: 1; min-width: 0; }
.player-name { font-size: 14px; font-weight: 700; }
.player-tags { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
.tag {
  font-size: 10px; font-family: 'Space Mono', monospace;
  padding: 2px 7px; border-radius: 100px; background: var(--border); color: var(--text-muted);
}
.tag.coppia { background: rgba(168,85,247,0.15); color: var(--accent-siria); }
.tag.affetto { background: rgba(255,107,43,0.15); color: var(--accent-cody); }
.tag.remoto { background: rgba(34,197,94,0.15); color: var(--green); }
.tag.bonus { background: rgba(245,158,11,0.15); color: var(--gold); }

.player-right { text-align: right; flex-shrink: 0; }
.player-cost { font-family: 'Space Mono', monospace; font-size: 15px; font-weight: 700; color: var(--accent-cody); }
.player-cost-label { font-size: 10px; color: var(--text-muted); }

.cap-badge {
  display: inline-block; font-size: 10px; font-family: 'Space Mono', monospace;
  background: rgba(245,158,11,0.2); color: var(--gold); border: 1px solid rgba(245,158,11,0.4);
  padding: 2px 8px; border-radius: 100px; margin-top: 4px;
}

/* ── LA MIA SQUADRA ── */
.squad-header { margin-bottom: 16px; }
.section-label {
  font-family: 'Space Mono', monospace; font-size: 11px;
  color: var(--text-muted); letter-spacing: .12em; text-transform: uppercase; margin-bottom: 8px;
}

.team-name-input {
  width: 100%; background: var(--surface); border: 1.5px solid var(--border);
  border-radius: 10px; padding: 12px 14px;
  color: var(--text); font-family: 'Space Grotesk', sans-serif;
  font-size: 15px; font-weight: 700; outline: none; transition: border-color .2s;
  margin-bottom: 16px;
}
.team-name-input:focus { border-color: var(--accent-cody); }
.team-name-input::placeholder { color: var(--text-muted); font-weight: 400; }

.squad-slot {
  background: var(--surface); border: 1.5px dashed var(--border);
  border-radius: 12px; padding: 14px 16px; margin-bottom: 8px;
  display: flex; align-items: center; gap: 12px; transition: all .2s;
}
.squad-slot.filled { border-style: solid; border-color: var(--border); }
.squad-slot.captain-slot { border-color: var(--gold); background: #150d00; }
.slot-num {
  width: 28px; height: 28px; border-radius: 8px;
  background: var(--border); display: flex; align-items: center; justify-content: center;
  font-family: 'Space Mono', monospace; font-size: 12px; color: var(--text-muted); flex-shrink: 0;
}
.squad-slot.captain-slot .slot-num { background: rgba(245,158,11,0.2); color: var(--gold); }
.slot-info { flex: 1; }
.slot-name { font-size: 14px; font-weight: 700; }
.slot-empty { font-size: 13px; color: var(--text-muted); }
.slot-cost { font-family: 'Space Mono', monospace; font-size: 13px; color: var(--accent-cody); }

.btn-set-cap {
  font-size: 10px; font-family: 'Space Mono', monospace;
  background: rgba(245,158,11,0.15); color: var(--gold);
  border: 1px solid rgba(245,158,11,0.3); padding: 4px 10px; border-radius: 100px;
  cursor: pointer; transition: all .2s; white-space: nowrap;
}
.btn-set-cap:hover { background: rgba(245,158,11,0.3); }
.btn-set-cap.is-cap { background: rgba(245,158,11,0.3); }
.btn-remove {
  font-size: 16px; color: var(--text-muted); cursor: pointer;
  padding: 4px; transition: color .2s; background: none; border: none;
}
.btn-remove:hover { color: var(--red); }

/* ── SAVE BTN ── */
.save-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: rgba(10,10,15,0.97); border-top: 1px solid var(--border);
  padding: 16px 20px; z-index: 60;
}
.btn-save {
  width: 100%; background: linear-gradient(135deg, var(--accent-cody), var(--accent-siria));
  color: white; padding: 16px; border-radius: 12px; border: none;
  font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 700;
  cursor: pointer; transition: opacity .2s;
}
.btn-save:hover { opacity: .85; }
.btn-save:disabled { opacity: .4; cursor: not-allowed; }

/* ── ALTRE SQUADRE ── */
.other-team-card {
  background: var(--surface); border: 1.5px solid var(--border);
  border-radius: 12px; padding: 16px; margin-bottom: 10px;
}
.other-team-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.other-team-name { font-size: 15px; font-weight: 800; }
.other-team-owner { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.other-team-count { font-family: 'Space Mono', monospace; font-size: 12px; color: var(--text-muted); }
.other-player-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px;
}
.other-player-row:last-child { border-bottom: none; }
.other-player-cap { color: var(--gold); font-size: 10px; font-family: 'Space Mono', monospace; }

/* ── EMPTY STATE ── */
.empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
.empty-emoji { font-size: 48px; display: block; margin-bottom: 12px; }

/* ── TOAST ── */
.toast {
  position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
  background: var(--surface); border: 1.5px solid var(--green);
  color: var(--green); font-family: 'Space Mono', monospace;
  font-size: 13px; padding: 12px 20px; border-radius: 100px;
  opacity: 0; transition: opacity .3s; pointer-events: none; white-space: nowrap; z-index: 200;
}
.toast.show { opacity: 1; }
.toast.error { border-color: var(--red); color: var(--red); }
.toast.warn { border-color: var(--gold); color: var(--gold); }

/* ── STATUS CHIP ── */
.status-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.status-chip {
  background: var(--surface); border: 1.5px solid var(--border);
  border-radius: 8px; padding: 8px 12px; font-size: 12px; text-align: center;
}
.status-chip .snum { font-family: 'Space Mono', monospace; font-size: 18px; font-weight: 700; display: block; }
.status-chip.ok .snum { color: var(--green); }
.status-chip.warn .snum { color: var(--gold); }
.status-chip.info .snum { color: var(--accent-siria); }
</style>
</head>

<!-- NAV -->
<div class="nav">

  <button onclick="window.location.href='home.html'" style="background:var(--surface);border:1.5px solid var(--border);color:var(--text-muted);padding:8px 14px;border-radius:10px;font-family:'Space Grotesk',sans-serif;font-size:13px;cursor:pointer;">← Home</button>

<!-- TAB: ALTRE SQUADRE -->
<div class="tab-content" id="content-altre-squadre">

</div>

<!-- SAVE BAR -->
<div class="save-bar">
  <button class="btn-save" id="save-btn" onclick="saveTeam()">Salva Squadra</button>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script type="module">

  { name: "Stefanuccio", cost: 130, tags: ["bonus"] },
];

const BUDGET = 500;
const MAX_PLAYERS = 5;

// ── STATO ──
let myName = localStorage.getItem("fc_player_name");
let myTeam = []; // array di { name, cost, tags }
let myCaptain = null; // nome del capitano
let myTeamName = "";
let allTeams = {}; // { playerName: { teamName, roster, captain } }

// ── INIT ──
async function init() {
  if (!myName) {
    window.location.href = "register.html";
    return;
  }

  // Verifica Firebase — se scollegato dall'admin torna al quiz
  const checkKey = myName.replace(/[.#$[\]]/g, "_");
  const checkSnap = await get(ref(db, `registrations/${checkKey}`));
  if (!checkSnap.exists()) {
    localStorage.removeItem("fc_player_name");
    localStorage.removeItem("fc_device_code");
    window.location.href = "quiz.html";
    return;
  }

  document.getElementById("nav-player-name").textContent = myName;

  // Carica team salvato
  const snap = await get(ref(db, `teams/${sanitize(myName)}`));
  if (snap.exists()) {
    const saved = snap.val();
    myTeamName = saved.teamName || "";
    myCaptain = saved.captain || null;
    myTeam = (saved.roster || []).map(n => PLAYERS.find(p => p.name === n)).filter(Boolean);
    document.getElementById("team-name-input").value = myTeamName;
  }

  renderSquad();
  renderPlayerList();
  updateBudget();

  // Ascolta tutte le squadre in tempo reale
  onValue(ref(db, "teams"), (snap) => {
    allTeams = snap.exists() ? snap.val() : {};
    renderOtherTeams();
  });

  // Aggiorna nome squadra live
  document.getElementById("team-name-input").addEventListener("input", (e) => {
    myTeamName = e.target.value;
  });
}

// ── BUDGET ──
function getSpent() { return myTeam.reduce((s, p) => s + p.cost, 0); }
function getRemaining() { return BUDGET - getSpent(); }

function updateBudget() {
  const rem = getRemaining();
  const pct = Math.max(0, Math.min(100, (rem / BUDGET) * 100));
  const el = document.getElementById("budget-display");
  const bar = document.getElementById("budget-bar-fill");

  el.textContent = rem + " ✂️";
  el.className = "budget-amount " + (rem < 0 ? "over" : rem < 100 ? "warn" : "ok");
  bar.style.width = pct + "%";
  bar.style.background = rem < 0 ? "var(--red)" : rem < 100 ? "var(--gold)" : "var(--green)";

  // Status chips
  const row = document.getElementById("budget-status-row");
  row.innerHTML = `
    <div class="status-chip ${rem >= 0 ? 'ok' : 'warn'}">
      <span class="snum">${getSpent()}</span>
      <span>Spesi</span>
    </div>
    <div class="status-chip info">
      <span class="snum">${myTeam.length}/${MAX_PLAYERS}</span>
      <span>Giocatori</span>
    </div>
    <div class="status-chip ${myCaptain ? 'ok' : 'warn'}">
      <span class="snum">${myCaptain ? '⭐' : '—'}</span>
      <span>Capitano</span>
    </div>
  `;

  // Bottone salva
  const canSave = myTeam.length >= 1;
  document.getElementById("save-btn").disabled = !canSave;
  document.getElementById("save-btn").textContent = canSave
    ? "✓ Salva Squadra (" + myTeam.length + "/5)"
    : "Aggiungi almeno 1 giocatore";
}

// ── ROSA (TAB MIA SQUADRA) ──
function renderSquad() {
  const container = document.getElementById("squad-slots");
  container.innerHTML = "";

  // Label aggiornata
  document.querySelector("#content-mia-squadra .section-label:last-of-type").textContent =
    `Rosa (${myTeam.length}/${MAX_PLAYERS}) — tocca un giocatore per rimuoverlo · tocca ⭐ per il capitano`;

  for (let i = 0; i < MAX_PLAYERS; i++) {
    const player = myTeam[i];
    const div = document.createElement("div");
    const isCap = player && player.name === myCaptain;
    div.className = "squad-slot " + (player ? (isCap ? "captain-slot" : "filled") : "");

    if (player) {
      div.innerHTML = `
        <div class="slot-num">${isCap ? "⭐" : (i + 1)}</div>
        <div class="slot-info">
          <div class="slot-name">${player.name}</div>
          <div class="slot-cost">${player.cost} ✂️ ${isCap ? '<span style="color:var(--gold);font-size:11px;">CAPITANO x2</span>' : ''}</div>
        </div>
        <button class="btn-set-cap ${isCap ? 'is-cap' : ''}" onclick="toggleCaptain('${player.name}')">
          ${isCap ? "⭐ Cap" : "⭐ Cap?"}
        </button>
        <button class="btn-remove" onclick="removePlayer('${player.name}')">✕</button>
      `;
    } else {
      div.innerHTML = `
        <div class="slot-num">${i + 1}</div>
        <div class="slot-info"><div class="slot-empty">Slot libero — vai su Giocatori</div></div>
      `;
    }
    container.appendChild(div);
  }
  updateBudget();
}

// ── LISTA GIOCATORI (TAB GIOCATORI) ──
window.renderPlayerList = function() {
  const q = (document.getElementById("player-search").value || "").toLowerCase();
  const grid = document.getElementById("player-grid");
  grid.innerHTML = "";

  const isFull = myTeam.length >= MAX_PLAYERS;

  [...PLAYERS].sort((a,b) => b.cost - a.cost)
    .filter(p => p.name.toLowerCase().includes(q))
    .forEach(player => {
      const isSelected = myTeam.some(t => t.name === player.name);
      const isCap = player.name === myCaptain;
      const cantAfford = !isSelected && getRemaining() < player.cost;
      const isDisabled = cantAfford;

      const div = document.createElement("div");
      div.className = "player-card " +
        (isCap ? "captain" : isSelected ? "selected" : "") +
        (isDisabled ? " full" : "");

      const initials = player.name.split(" ").map(w => w[0]).join("").slice(0, 2).toUpperCase();

      const tagHtml = "";

      div.innerHTML = `
        <div class="player-avatar">${isSelected ? (isCap ? "⭐" : "✓") : initials}</div>
        <div class="player-info">
          <div class="player-name">${player.name}</div>
        </div>
        <div class="player-right">
          <div class="player-cost">${player.cost}</div>
          <div class="player-cost-label">✂️ Capelli</div>
          ${isCap ? '<div class="cap-badge">⭐ Capitano</div>' : ""}
        </div>
      `;

      if (!isDisabled) {
        div.onclick = () => togglePlayer(player);
      }
      grid.appendChild(div);
    });
};

// ── ALTRE SQUADRE ──
function renderOtherTeams() {
  const container = document.getElementById("other-teams-list");
  container.innerHTML = "";

  const entries = Object.entries(allTeams).filter(([owner]) => owner !== sanitize(myName));

  if (entries.length === 0) {
    container.innerHTML = `<div class="empty-state"><span class="empty-emoji">👀</span>Nessuna squadra ancora.<br>Sii il primo!</div>`;
    return;
  }

  entries.forEach(([ownerKey, team]) => {
    const div = document.createElement("div");
    div.className = "other-team-card";
    const rosterHtml = (team.roster || []).map(name => `
      <div class="other-player-row">
        <span>${name === team.captain ? "⭐ " : ""}${name}</span>
        ${name === team.captain ? '<span class="other-player-cap">CAPITANO</span>' : ""}
      </div>
    `).join("");

    div.innerHTML = `
      <div class="other-team-header">
        <div>
          <div class="other-team-name">${team.teamName || "Squadra senza nome"}</div>
          <div class="other-team-owner">di ${ownerKey.replace(/_/g, " ")}</div>
        </div>
        <div class="other-team-count">${(team.roster || []).length}/${MAX_PLAYERS}</div>
      </div>
      ${rosterHtml}
    `;
    container.appendChild(div);
  });
}

// ── AZIONI ──
window.togglePlayer = function(player) {
  const idx = myTeam.findIndex(t => t.name === player.name);
  if (idx >= 0) {
    removePlayer(player.name);
  } else {
    if (myTeam.length >= MAX_PLAYERS) { showToast("Hai già 5 giocatori — rimuovine uno per cambiare.", "warn"); return; }
    if (getRemaining() < player.cost) { showToast("Budget insufficiente! ✂️", "error"); return; }
    myTeam.push(player);
    showToast(`+ ${player.name} aggiunto`);
    renderSquad();
    renderPlayerList();
  }
};

window.removePlayer = function(name) {
  myTeam = myTeam.filter(p => p.name !== name);
  if (myCaptain === name) myCaptain = null;
  renderSquad();
  renderPlayerList();
};

window.toggleCaptain = function(name) {
  myCaptain = (myCaptain === name) ? null : name;
  renderSquad();
  renderPlayerList();
  showToast(myCaptain === name ? `⭐ ${name} è il capitano!` : "Capitano rimosso");
};

window.saveTeam = async function() {
  if (myTeam.length === 0) { showToast("Aggiungi almeno 1 giocatore!", "error"); return; }
  const btn = document.getElementById("save-btn");
  btn.textContent = "Salvataggio...";
  btn.disabled = true;

  await set(ref(db, `teams/${sanitize(myName)}`), {
    teamName: myTeamName || "Squadra di " + myName,
    roster: myTeam.map(p => p.name),
    captain: myCaptain || myTeam[0].name,
    owner: myName,
    savedAt: Date.now()
  });

  showToast("✓ Squadra salvata!");
  btn.disabled = false;
  updateBudget();
};

// ── TABS ──
window.switchTab = function(tab) {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".tab-content").forEach(t => t.classList.remove("active"));
  document.getElementById("tab-" + tab).classList.add("active");
  document.getElementById("content-" + tab).classList.add("active");
  if (tab === "giocatori") renderPlayerList();
  if (tab === "altre-squadre") renderOtherTeams();
};

// ── UTILS ──
function sanitize(str) { return str.replace(/[.#$[\]]/g, "_"); }

function showToast(msg, type = "ok") {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show" + (type === "error" ? " error" : type === "warn" ? " warn" : "");
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => { t.className = "toast"; }, 2500);
}

init();
</script>
</body>
</html>
