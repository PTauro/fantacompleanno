<title>FantaCompleanno — Regolamento</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700;800&family=Space+Mono:wght@400;700&display=swap');

:root {
  --bg: #0a0a0f; --surface: #13131a; --border: #1e1e2e;
  --accent-cody: #ff6b2b; --accent-siria: #a855f7;
  --text: #f0f0f5; --text-muted: #6b6b8a;
  --green: #22c55e; --red: #ef4444; --gold: #f59e0b;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Space Grotesk', sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh;
}

/* NAV TOP */
.nav {
  position: sticky; top: 0; z-index: 50;
  background: rgba(10,10,15,0.97); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px; display: flex; align-items: center; justify-content: space-between;
}
.nav-label { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--accent-cody); letter-spacing:.1em; }
.nav-title { font-size: 17px; font-weight: 800; }
.btn-back {
  background: var(--surface); border: 1.5px solid var(--border);
  color: var(--text-muted); width: 36px; height: 36px; border-radius: 10px;
  font-size: 16px; cursor: pointer; display:flex; align-items:center; justify-content:center;
}

/* SEARCH */
.search-wrap { padding: 14px 20px 0; position: relative; }
.search-input {
  width: 100%; background: var(--surface); border: 1.5px solid var(--border);
  border-radius: 12px; padding: 12px 14px 12px 40px;
  color: var(--text); font-family: 'Space Grotesk', sans-serif;
  font-size: 14px; outline: none; transition: border-color .2s;
}
.search-input:focus { border-color: var(--accent-cody); }
.search-input::placeholder { color: var(--text-muted); }
.search-icon { position: absolute; left: 34px; top: 50%; transform: translateY(-50%); font-size: 15px; pointer-events: none; }

/* CATEGORY ACCORDION */
.section { padding: 16px 20px; }
.cat-accordion {
  background: var(--surface); border: 1.5px solid var(--border);
  border-radius: 14px; margin-bottom: 10px; overflow: hidden;
}
.cat-header {
  padding: 16px; display: flex; align-items: center; gap: 12px;
  cursor: pointer; transition: background .2s;
}
.cat-header:hover { background: rgba(255,255,255,0.02); }
.cat-icon { font-size: 24px; flex-shrink: 0; }
.cat-info { flex: 1; }
.cat-title { font-size: 15px; font-weight: 800; }
.cat-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.cat-chevron { color: var(--text-muted); font-size: 14px; transition: transform .3s; flex-shrink: 0; }
.cat-accordion.open .cat-chevron { transform: rotate(180deg); }

.cat-body { display: none; padding: 0 16px 16px; }
.cat-accordion.open .cat-body { display: block; animation: slideDown .25s ease; }
@keyframes slideDown { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }

.cat-note {
  background: rgba(168,85,247,0.1); border: 1px solid rgba(168,85,247,0.3);
  border-radius: 10px; padding: 12px; margin-bottom: 12px; font-size: 12px;
  color: var(--accent-siria); line-height: 1.5;
}

/* SUB SECTION (bonus/malus) */
.sub-section-title {
  font-family: 'Space Mono', monospace; font-size: 11px;
  letter-spacing: .12em; text-transform: uppercase; margin: 14px 0 8px;
}

/* ITEM ACCORDION (inner) */
.item-row {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 10px; margin-bottom: 6px; overflow: hidden;
}
.item-header {
  display: flex; align-items: center; gap: 10px; padding: 12px 14px;
  cursor: pointer; transition: background .15s;
}
.item-header:hover { background: rgba(255,255,255,0.02); }
.item-pts { font-family: 'Space Mono', monospace; font-size: 14px; font-weight: 700; min-width: 60px; flex-shrink: 0; }
.item-pts.pos { color: var(--green); }
.item-pts.neg { color: var(--red); }
.item-info { flex: 1; min-width: 0; }
.item-desc { font-size: 13px; font-weight: 600; }
.item-type { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
.item-chevron { color: var(--text-muted); font-size: 11px; transition: transform .25s; flex-shrink: 0; }
.item-row.open .item-chevron { transform: rotate(180deg); }
.item-detail {
  display: none; padding: 0 14px 12px; font-size: 12px; color: var(--text-muted); line-height: 1.6;
}
.item-row.open .item-detail { display: block; }
.item-detail-inner {
  padding: 10px 12px; border-radius: 8px;
}
.item-row.open.bonus-item .item-detail-inner { background: rgba(34,197,94,0.06); border: 1px solid rgba(34,197,94,0.2); }
.item-row.open.malus-item .item-detail-inner { background: rgba(239,68,68,0.06); border: 1px solid rgba(239,68,68,0.2); }

.empty-results { text-align: center; padding: 30px 20px; color: var(--text-muted); font-size: 13px; }

/* ── BOTTOM NAV BAR ── */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
  background: rgba(13,13,20,0.97); backdrop-filter: blur(16px);
  border-top: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-around;
  padding: 8px 4px calc(8px + env(safe-area-inset-bottom, 0px));
}
.nav-item {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  text-decoration: none; color: var(--text-muted);
  padding: 6px 10px; border-radius: 12px; transition: all .2s;
  flex: 1; min-width: 0;
}
.nav-item.active { color: var(--accent-cody); }
.nav-icon { font-size: 20px; line-height: 1; }
.nav-label { font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: .05em; white-space: nowrap; }
.nav-item-center {
  position: relative; top: -10px;
}
.nav-item-center .nav-icon {
  width: 46px; height: 46px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent-cody), var(--accent-siria));
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; box-shadow: 0 4px 16px rgba(255,107,43,0.35);
}
.nav-item-center.active .nav-icon { box-shadow: 0 4px 20px rgba(255,107,43,0.6); }
.nav-item-center .nav-label { color: var(--text-muted); }
.nav-item-center.active .nav-label { color: var(--text); }

/* Spazio extra in fondo alla pagina per non sovrapporsi alla nav */
body { padding-bottom: 90px !important; }

/* ── FAB REGOLAMENTO ── */
.fab-regolamento {
  position: fixed; right: 16px; z-index: 199;
  bottom: 96px;
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--surface); border: 1.5px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; text-decoration: none; cursor: pointer;
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  transition: all .2s;
}
.fab-regolamento:hover { border-color: var(--accent-cody); transform: scale(1.05); }

const CAT_META = {
  cat1: { icon: "🎯" },
  cat2: { icon: "✂️" },
  cat3: { icon: "👗" },
  cat4: { icon: "🎉" },
  cat5: { icon: "🎮" },
  cat6: { icon: "⚔️" },
  adpersonam: { icon: "🎭" },
};

const CAT_ORDER = ["cat1","cat2","cat3","cat4","cat5","cat6","adpersonam"];

let openCats = new Set();
let openItems = new Set();

function matchQuery(text, q) {
  return text.toLowerCase().includes(q);
}

function renderAll() {
  const q = (document.getElementById("search").value || "").toLowerCase().trim();
  const container = document.getElementById("categories");
  container.innerHTML = "";

  let anyResult = false;

  CAT_ORDER.forEach(catKey => {
    const data = REG[catKey];
    const meta = CAT_META[catKey];

    // Filtra bonus/malus in base alla query
    let bonus = data.bonus || [];
    let malus = data.malus || [];

    if (q) {
      bonus = bonus.filter(r => matchQuery(r.desc + " " + (r.detail||"") + " " + r.type, q));
      malus = malus.filter(r => matchQuery(r.desc + " " + (r.detail||"") + " " + r.type, q));
    }

    const totalCount = (data.bonus||[]).length + (data.malus||[]).length;
    const visibleCount = bonus.length + malus.length;

    // Se c'è una query e questa categoria non ha risultati, salta (a meno che il titolo combaci)
    if (q && visibleCount === 0 && !matchQuery(data.title, q)) return;

    anyResult = true;
    const isOpen = openCats.has(catKey) || (q && visibleCount > 0);

    const acc = document.createElement("div");
    acc.className = "cat-accordion" + (isOpen ? " open" : "");
    acc.id = "cat_" + catKey;

    const header = document.createElement("div");
    header.className = "cat-header";
    header.onclick = () => toggleCat(catKey);
    header.innerHTML = `
      <div class="cat-icon">${meta.icon}</div>
      <div class="cat-info">
        <div class="cat-title">${data.title}</div>
        <div class="cat-sub">${totalCount} regole${q && visibleCount !== totalCount ? ` · ${visibleCount} corrispondenti` : ''}</div>
      </div>
      <div class="cat-chevron">▼</div>
    `;
    acc.appendChild(header);

    const body = document.createElement("div");
    body.className = "cat-body";

    if (data.note) {
      const note = document.createElement("div");
      note.className = "cat-note";
      note.textContent = data.note;
      body.appendChild(note);
    }

    if (bonus.length > 0) {
      const label = document.createElement("div");
      label.className = "sub-section-title";
      label.style.color = "var(--green)";
      label.textContent = "✅ Bonus";
      body.appendChild(label);
      bonus.forEach((r, i) => body.appendChild(renderItem(r, catKey, "bonus", i)));
    }

    if (malus.length > 0) {
      const label = document.createElement("div");
      label.className = "sub-section-title";
      label.style.color = "var(--red)";
      label.textContent = "❌ Malus";
      body.appendChild(label);
      malus.forEach((r, i) => body.appendChild(renderItem(r, catKey, "malus", i)));
    }

    acc.appendChild(body);
    container.appendChild(acc);
  });

  if (!anyResult) {
    container.innerHTML = '<div class="empty-results">🔍 Nessun risultato per la tua ricerca.</div>';
  }
}

function renderItem(r, catKey, tipo, i) {
  const id = tipo + "_" + catKey + "_" + i;
  const isOpen = openItems.has(id);

  const row = document.createElement("div");
  row.className = "item-row " + tipo + "-item" + (isOpen ? " open" : "");
  row.id = "item_" + id;

  const header = document.createElement("div");
  header.className = "item-header";
  header.onclick = (e) => { e.stopPropagation(); toggleItem(id); };
  header.innerHTML = `
    <div class="item-pts ${tipo === 'bonus' ? 'pos' : 'neg'}">${r.pts}</div>
    <div class="item-info">
      <div class="item-desc">${r.desc}</div>
      <div class="item-type">${r.type}</div>
    </div>
    <div class="item-chevron">▼</div>
  `;
  row.appendChild(header);

  const detail = document.createElement("div");
  detail.className = "item-detail";
  detail.innerHTML = `<div class="item-detail-inner">${r.detail || ''}</div>`;
  row.appendChild(detail);

  return row;
}

window.toggleCat = function(catKey) {
  if (openCats.has(catKey)) openCats.delete(catKey);
  else openCats.add(catKey);
  renderAll();
};

window.toggleItem = function(id) {
  if (openItems.has(id)) openItems.delete(id);
  else openItems.add(id);
  renderAll();
};

renderAll();
</script>
